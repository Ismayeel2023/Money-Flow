name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Keep installer module in Gradle settings
        run: |
          if ! grep -q "include ':installer'" android/settings.gradle; then
            echo "include ':installer'" >> android/settings.gradle
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Restore Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Verify JDK 21
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          test -n "$JAVA_HOME"

      - name: Build Money Flow Debug APK
        working-directory: ./android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Embed APK and build installer
        working-directory: ./android
        run: |
          mkdir -p installer/src/main/assets
          cp app/build/outputs/apk/debug/app-debug.apk installer/src/main/assets/moneyflow.bin
          ls -lh installer/src/main/assets/moneyflow.bin
          ./gradlew :installer:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Money Flow APK not found!"
            exit 1
          fi
          if [ ! -f "android/installer/build/outputs/apk/debug/installer-debug.apk" ]; then
            echo "Installer APK not found!"
            find android -name "*.apk" -print || true
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/installer/build/outputs/apk/debug/installer-debug.apk

      - name: Upload Money Flow Installer
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-installer
          path: android/installer/build/outputs/apk/debug/installer-debug.apk
          retention-days: 14

      - name: Upload Money Flow App APK
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
